name: Student Experience

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "apps/student-next/**"
      - "content/flashcards/westgard_qc_basics.deck.json"
      - ".github/workflows/student-pages.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "apps/student-next/**"
      - "content/flashcards/westgard_qc_basics.deck.json"
      - ".github/workflows/student-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "student-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check apps/student-next/app.js

      - name: Validate canonical card deck
        run: python -m json.tool content/flashcards/westgard_qc_basics.deck.json > /dev/null

      - name: Assemble static student site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp apps/student-next/index.html _site/index.html
          cp apps/student-next/styles.css _site/styles.css
          cp apps/student-next/app.js _site/app.js
          cp content/flashcards/westgard_qc_basics.deck.json _site/data/cards.json
          touch _site/.nojekyll

      - name: Verify required assets
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/data/cards.json

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
