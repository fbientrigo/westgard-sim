name: Student Experience

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "apps/student-next/**"
      - "content/flashcards/westgard_qc_basics.deck.json"
      - "content/practice_scenarios.json"
      - "content/rules_reference.json"
      - "qc_lab_simulator/evidence.py"
      - "scripts/export_student_next_data.py"
      - ".github/workflows/student-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/student-next/**"
      - "content/flashcards/westgard_qc_basics.deck.json"
      - "content/practice_scenarios.json"
      - "content/rules_reference.json"
      - "qc_lab_simulator/evidence.py"
      - "scripts/export_student_next_data.py"
      - ".github/workflows/student-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "student-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check JavaScript syntax
        run: node --check apps/student-next/app.js

      - name: Run frontend tests
        run: node --test apps/student-next/test/*.test.js

      - name: Install test runner
        run: pip install pytest

      - name: Test canonical evidence and export contract
        run: python -m pytest tests/test_evidence.py tests/test_student_next_export.py -q

      - name: Generate static student data
        run: python scripts/export_student_next_data.py --output-dir _site/data

      - name: Assemble static student site
        shell: bash
        run: |
          set -euo pipefail
          cp apps/student-next/index.html _site/index.html
          cp apps/student-next/styles.css _site/styles.css
          cp apps/student-next/app.js _site/app.js
          cp -R apps/student-next/src _site/src
          touch _site/.nojekyll

      - name: Verify required assets
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/data/cards.json
          test -s _site/data/rules.json
          test -s _site/data/practice.json

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
